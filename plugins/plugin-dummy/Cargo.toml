[package]
name = "plugin-dummy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plugin-dummy"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"